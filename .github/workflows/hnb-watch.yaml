# .github/workflows/hnb-watch.yml
#
# Runs the watcher every weekday in GitHub's cloud, so nothing depends on your Mac
# being awake. The CSV history is committed back to the repo, which keeps a durable
# record even if the sheet is edited by hand.
#
# Secrets to add under Settings > Secrets and variables > Actions > Secrets:
#   GOOGLE_SA_JSON     the full service-account JSON, pasted as one secret
#   SHEET_ID           1f1CZB6vt688B48VoNU1fK64huntXTwQW-zztvQ9WA4s
#   TELEGRAM_BOT_TOKEN from @BotFather
#   TELEGRAM_CHAT_ID   from @userinfobot
#
# Optional, under the Variables tab (not Secrets — these aren't sensitive, and
# keeping them as variables lets you retune the rule without editing this file):
#   ALERT_MODE         n_day_high | threshold | both     (default n_day_high)
#   ALERT_WINDOW       30
#   ALERT_THRESHOLD    e.g. 330.0
#   ALERT_COOLDOWN_DAYS 3
#
# Email is deliberately omitted: a Gmail App Password grants permanent send-as-you
# access to your whole mailbox, which is far too much authority for a rate ping.
# Telegram gives the same phone notification with a token that can only message you.
#
# Remember to share the sheet with the service account's client_email address,
# giving it Editor access, or the append will fail with a permission error.

name: HNB USD rate watch

on:
  schedule:
    # 05:00 UTC = 10:30 Sri Lanka time (UTC+5:30).
    # NOTE: this is only a BACKSTOP. GitHub's cron scheduler has been observed
    # starting this workflow 6-12 hours late, which is useless for same-day
    # action. The punctual trigger is the external scheduler (Cloudflare Worker)
    # calling workflow_dispatch, and/or the local launchd job. Runs are
    # idempotent -- deduped on the page's own date -- so firing from several
    # sources on the same day is harmless.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run by hand to test

permissions:
  contents: write         # needed to commit the updated CSV

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright pandas gspread google-auth requests
          playwright install --with-deps chromium

      - name: Write service account key
        env:
          # Passed via env, never interpolated into the shell command. Direct
          # ${{ }} substitution inside `run:` breaks on quotes in the JSON and
          # can expose the value in traces.
          SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          # Whitespace-only counts as unset: a secret saved with an empty paste
          # is non-empty to the shell but useless, which is a confusing failure.
          if [ -z "$(printf '%s' "$SA_JSON" | tr -d '[:space:]')" ]; then
            echo "::warning::GOOGLE_SA_JSON is empty or whitespace. Skipping the"\
                 "sheet update; the CSV and Telegram alert still work."
            exit 0
          fi
          printf '%s' "$SA_JSON" > sa.json
          chmod 600 sa.json
          python - <<'PY'
          import json, sys
          try:
              key = json.load(open("sa.json"))
          except Exception as exc:
              sys.exit("::error::GOOGLE_SA_JSON is not valid JSON (%s). Re-add the "
                       "secret with the ENTIRE contents of your key file, starting "
                       "with { and ending with }." % exc)
          missing = [k for k in ("type", "client_email", "private_key") if k not in key]
          if missing:
              sys.exit("::error::key file is missing %s -- looks like a partial paste."
                       % ", ".join(missing))
          print("service account key OK:", key["client_email"])
          PY

      - name: Run watcher
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: sa.json
          ALERT_MODE: ${{ vars.ALERT_MODE || 'n_day_high' }}
          ALERT_WINDOW: ${{ vars.ALERT_WINDOW || '30' }}
          ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD }}
          ALERT_COOLDOWN_DAYS: ${{ vars.ALERT_COOLDOWN_DAYS || '3' }}
          # Telegram only — no Gmail App Password, which would grant send-as-you
          # access to the whole mailbox for the sake of a notification.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hnb_watch.py run

      - name: Commit updated history
        run: |
          rm -f sa.json
          git config user.name "hnb-watch-bot"
          git config user.email "actions@github.com"
          # -f because .gitignore blocks *.json. The state file carries the
          # alert cooldown; without committing it, every cloud run starts with
          # a blank cooldown and a sustained high would alert every single day.
          git add hnb_usd_buying.csv || true
          git add -f hnb_watch_state.json || true
          git diff --staged --quiet || git commit -m "rates: $(date -u +%Y-%m-%d)"
          # Rebase before pushing: the local launchd job may have pushed first.
          git pull --rebase --autostash || true
          git push || true
